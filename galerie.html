<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">

<style>
.filter-buttons {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.filter-buttons button {
  padding:8px 15px;
  border:none;
  border-radius:20px;
  background:#eee;
  cursor:pointer;
}

.filter-buttons button.active {
  background:#C8A96A;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
  gap:15px;
}

.grid-item {
  overflow:hidden;
  border-radius:10px;
}

.grid-item img,
.grid-item video {
  width:100%;
  height:200px;
  object-fit:cover;
}
</style>

</head>
<body>

<header class="header">
  <a href="index.html" class="logo">
    <img src="logo.png" alt="Logo">
  </a>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="pakete.html">Pakete</a>
    <a href="galerie.html">Galerie</a>
    <a href="ablauf.html">Ablauf</a>
    <a href="kontakt.html">Kontakt</a>
    <a href="ueber-uns.html">Über uns</a>
  </nav>
</header>

<div class="container">
<h1>Galerie</h1>

<!-- FILTER -->
<div class="filter-buttons">
  <button class="active" onclick="filterItems('all', this)">Alle</button>
  <button onclick="filterItems('photo', this)">Fotos</button>
  <button onclick="filterItems('video', this)">Videos</button>
  <button onclick="filterItems('music', this)">Live Musik</button>
</div>

<!-- GRID -->
<div class="grid">

<!-- FOTO -->
<div class="grid-item" data-category="photo">
<img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486">
</div>

<div class="grid-item" data-category="photo">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552">
</div>

<!-- VIDEO -->
<div class="grid-item" data-category="video">
<video controls>
  <source src="your-video.mp4" type="video/mp4">
</video>
</div>

<!-- LIVE MUSIK -->
<div class="grid-item" data-category="music">
<img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f">
</div>

<div class="grid-item" data-category="music">
<img src="https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2">
</div>

</div>
</div>

<script>
function filterItems(category, btn){

// active button
document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
btn.classList.add('active');

// filter items
document.querySelectorAll('.grid-item').forEach(item => {
  if(category === 'all' || item.dataset.category === category){
    item.style.display = 'block';
  } else {
    item.style.display = 'none';
  }
});

}
</script>

</body>
</html>
